name: cf-ip-optimizer

services:
  cfst:
    profiles: ["manual"]
    image: cf-ip-optimizer:cfst-2.3.5
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CFST_VERSION: "2.3.5"
    platform: linux/amd64
    init: true
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=100
      - /work:rw,noexec,nosuid,size=256m,uid=1000,gid=100
    working_dir: /work
    volumes:
      - ./data/input:/input:ro
      - ./data/output:/output:rw
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    networks:
      - cf-ip-optimizer-net
    command: ["-h"]

networks:
  cf-ip-optimizer-net:
    name: cf-ip-optimizer-net
    driver: bridge
