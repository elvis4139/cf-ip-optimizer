services:
  cf-ip-optimizer:
    container_name: cf-ip-optimizer
    image: cf-ip-optimizer:stage3
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:0"
    init: true
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=0
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ./bin:/opt/cf-ip-optimizer/bin:ro
      - ./config:/opt/cf-ip-optimizer/config:ro
      - ./data:/opt/cf-ip-optimizer/data
      - ./samples:/opt/cf-ip-optimizer/samples
      - ./logs:/opt/cf-ip-optimizer/logs
    command: ["python", "--version"]
    networks:
      - cf_optimizer_net
networks:
  cf_optimizer_net:
    name: cf-ip-optimizer-net
    driver: bridge
