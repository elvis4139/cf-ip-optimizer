name: cf-ip-optimizer
services:
  optimizer:
    profiles: ["manual"]
    image: cf-ip-optimizer:stage2
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CFST_VERSION: "2.3.5"
    platform: linux/amd64
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=100
      - /work:rw,noexec,nosuid,size=512m,uid=1000,gid=100
    volumes:
      - ./data/input:/input:ro
      - ./data/output:/output:rw
      - ./config:/config:ro
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    networks: [cf-ip-optimizer-net]
    command: ["--help"]
networks:
  cf-ip-optimizer-net:
    name: cf-ip-optimizer-runtime-net
    driver: bridge
