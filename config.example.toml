# Agreed policy defaults: first get top 80, then retest the top 50 from that set.
[cfst]
version = "2.3.5"
binary = "/usr/local/bin/cfst"
port = 443
input_file = "/input/ipv4.txt"
process_timeout_seconds = 1800

[selection]
first_top_n = 80
second_top_n = 50
max_loss_ratio = 0.0

[stage1]
# Exact CFST v2.3.5 arguments to be set after checking `cfst -h`. Use {input}, {csv}, {run_dir}.
args = []

[stage2]
# Same; {input} is the generated list of the first-pass fastest 50 among top80.
args = []

[paths]
work_dir = "/work/runs"

[output]
enabled = false
path = "/output/nodes.txt"
